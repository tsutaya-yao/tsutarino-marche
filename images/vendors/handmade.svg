<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- ハンドメイド作家：イメージイラスト（毛糸・糸巻き・はさみ・ボタン・布小物） -->
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="3" fill="#F2A21B" opacity=".22"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#FFF1B8"/>
  <rect width="800" height="600" fill="url(#dots)"/>

  <!-- 旗飾り -->
  <path d="M0 40 Q400 110 800 40" fill="none" stroke="#5B4038" stroke-width="4"/>
  <g stroke="#5B4038" stroke-width="3" stroke-linejoin="round">
    <path d="M40 48 L88 58 L60 104 Z" fill="#F2A21B"/>
    <path d="M140 66 L190 74 L160 122 Z" fill="#4FA7DE"/>
    <path d="M244 80 L296 85 L266 134 Z" fill="#7DB93C"/>
    <path d="M350 88 L402 89 L376 140 Z" fill="#F2A21B"/>
    <path d="M456 88 L508 85 L484 136 Z" fill="#E98A8A"/>
    <path d="M562 80 L612 73 L594 124 Z" fill="#4FA7DE"/>
    <path d="M664 66 L714 56 L700 108 Z" fill="#7DB93C"/>
  </g>

  <!-- 作業台 -->
  <rect x="60" y="470" width="680" height="34" rx="10" fill="#B0855F" stroke="#5B4038" stroke-width="5"/>
  <rect x="60" y="500" width="680" height="16" rx="6" fill="#8A6343"/>

  <!-- 毛糸玉＋編み棒 -->
  <g transform="translate(190 368)">
    <line x1="-40" y1="-120" x2="70" y2="40" stroke="#5B4038" stroke-width="9" stroke-linecap="round"/>
    <line x1="-80" y1="-90" x2="60" y2="30" stroke="#5B4038" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-40" cy="-120" r="10" fill="#F2A21B" stroke="#5B4038" stroke-width="4"/>
    <circle cx="-80" cy="-90" r="10" fill="#F2A21B" stroke="#5B4038" stroke-width="4"/>
    <circle cx="0" cy="20" r="92" fill="#E98A8A" stroke="#5B4038" stroke-width="6"/>
    <g fill="none" stroke="#C9605F" stroke-width="6" stroke-linecap="round">
      <path d="M-78 -20 Q0 -70 70 -40"/>
      <path d="M-88 20 Q0 -40 88 6"/>
      <path d="M-80 60 Q0 0 84 48"/>
      <path d="M-40 100 Q20 40 60 88"/>
    </g>
    <path d="M86 60 Q140 110 120 102 Q170 96 210 102" fill="none" stroke="#E98A8A" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 布のトートバッグ -->
  <g transform="translate(400 300)">
    <path d="M-30 0 Q-30 -70 30 -70 Q90 -70 90 0" fill="none" stroke="#5B4038" stroke-width="10"/>
    <path d="M-80 0 H140 L120 168 H-60 Z" fill="#7DB93C" stroke="#5B4038" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-72 30 H132" stroke="#fff" stroke-width="5" stroke-dasharray="12 10" opacity=".8"/>
    <path d="M-64 150 H124" stroke="#fff" stroke-width="5" stroke-dasharray="12 10" opacity=".8"/>
    <!-- ワッペン：花 -->
    <g transform="translate(30 90)">
      <circle r="34" fill="#FFF1B8" stroke="#5B4038" stroke-width="4"/>
      <g fill="#F2A21B" stroke="#5B4038" stroke-width="3">
        <circle cx="0" cy="-15" r="10"/><circle cx="14" cy="-5" r="10"/><circle cx="9" cy="12" r="10"/>
        <circle cx="-9" cy="12" r="10"/><circle cx="-14" cy="-5" r="10"/>
      </g>
      <circle r="8" fill="#5B4038"/>
    </g>
  </g>

  <!-- 糸巻き -->
  <g transform="translate(615 350)">
    <rect x="-46" y="-92" width="92" height="18" rx="6" fill="#B0855F" stroke="#5B4038" stroke-width="5"/>
    <rect x="-46" y="102" width="92" height="18" rx="6" fill="#B0855F" stroke="#5B4038" stroke-width="5"/>
    <rect x="-34" y="-74" width="68" height="176" fill="#4FA7DE" stroke="#5B4038" stroke-width="5"/>
    <g stroke="#2F7FB3" stroke-width="4">
      <line x1="-34" y1="-50" x2="34" y2="-40"/><line x1="-34" y1="-20" x2="34" y2="-10"/>
      <line x1="-34" y1="10" x2="34" y2="20"/><line x1="-34" y1="40" x2="34" y2="50"/>
      <line x1="-34" y1="70" x2="34" y2="80"/>
    </g>
    <path d="M34 60 Q80 70 70 116" fill="none" stroke="#4FA7DE" stroke-width="5" stroke-linecap="round"/>
    <!-- 針 -->
    <line x1="60" y1="-60" x2="120" y2="40" stroke="#8C8C8C" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="62" cy="-56" rx="3" ry="7" fill="none" stroke="#8C8C8C" stroke-width="3" transform="rotate(-30 62 -56)"/>
  </g>

  <!-- はさみ -->
  <g transform="translate(300 450) rotate(-12)">
    <path d="M0 0 L150 -30" stroke="#8C8C8C" stroke-width="12" stroke-linecap="round"/>
    <path d="M0 0 L150 20" stroke="#A5A5A5" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-22" cy="-16" r="20" fill="none" stroke="#F2A21B" stroke-width="10"/>
    <circle cx="-22" cy="20" r="20" fill="none" stroke="#F2A21B" stroke-width="10"/>
    <circle cx="10" cy="0" r="6" fill="#5B4038"/>
  </g>

  <!-- ボタン -->
  <g stroke="#5B4038" stroke-width="4">
    <g transform="translate(520 440)"><circle r="22" fill="#E98A8A"/><g fill="#5B4038" stroke="none"><circle cx="-6" cy="-6" r="3.5"/><circle cx="6" cy="-6" r="3.5"/><circle cx="-6" cy="6" r="3.5"/><circle cx="6" cy="6" r="3.5"/></g></g>
    <g transform="translate(570 452)"><circle r="16" fill="#7DB93C"/><g fill="#5B4038" stroke="none"><circle cx="-4" cy="0" r="3"/><circle cx="4" cy="0" r="3"/></g></g>
    <g transform="translate(700 448)"><circle r="20" fill="#F2A21B"/><g fill="#5B4038" stroke="none"><circle cx="-5" cy="-5" r="3"/><circle cx="5" cy="-5" r="3"/><circle cx="-5" cy="5" r="3"/><circle cx="5" cy="5" r="3"/></g></g>
  </g>

  <!-- きらきら -->
  <g fill="#F2A21B">
    <path d="M120 200 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/>
    <path d="M700 200 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z"/>
    <path d="M560 180 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
  </g>
</svg>
